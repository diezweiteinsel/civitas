name: CI

on:
  push:
  pull_request:

# Cancel in-progress runs on the same branch/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────
  # BACKEND — Lint
  # ──────────────────────────────────────────────
  backend-lint:
    name: "Backend: Lint (ruff)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --frozen
        working-directory: backend

      - name: Ruff check
        run: uv run ruff check src/
        working-directory: backend

  # ──────────────────────────────────────────────
  # BACKEND — Test
  # ──────────────────────────────────────────────
  backend-test:
    name: "Backend: Test (pytest)"
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:15
        env:
          POSTGRES_DB: civitas_db_test
          POSTGRES_USER: civitas_user
          POSTGRES_PASSWORD: securepassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U civitas_user -d civitas_db_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --frozen
        working-directory: backend

      - name: Run pytest
        env:
          DATABASE_URL: "postgresql://civitas_user:securepassword@localhost:5432/civitas_db_test"
          DB_HOST: localhost
          SECRET_KEY: "a-test-secret-key"
          ALGORITHM: "HS256"
          DEV_SQLITE: "0"
        run: |
          uv run pytest \
            --junitxml=report.xml \
            --cov=backend \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing
        working-directory: backend

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: |
            backend/report.xml
            backend/coverage.xml

  # ──────────────────────────────────────────────
  # FRONTEND — Lint
  # ──────────────────────────────────────────────
  frontend-lint:
    name: "Frontend: Lint (ESLint)"
    runs-on: ubuntu-latest
    # TODO: Remove 'if: false' once ESLint is configured
    if: false
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: ESLint
        run: npx eslint src/
        working-directory: frontend

  # ──────────────────────────────────────────────
  # FRONTEND — Test
  # ──────────────────────────────────────────────
  frontend-test:
    name: "Frontend: Test (Jest)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Run tests
        run: npm test -- --watchAll=false --coverage
        working-directory: frontend

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-results
          path: |
            frontend/reports/junit.xml
            frontend/coverage/

  # ──────────────────────────────────────────────
  # DOCKER — Sanity builds (main only)
  # ──────────────────────────────────────────────
  build-images:
    name: "Docker: Sanity build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t sanity-backend:ci ./backend

      - name: Build frontend image
        run: docker build --build-arg REACT_APP_API_URL="/api" -f frontend/Dockerfile -t sanity-frontend:ci .